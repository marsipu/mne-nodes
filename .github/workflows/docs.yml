name: "Render Documentation"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  screenshots:
    name: Capture screenshots (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: windows
          - runner: macos-latest
            platform: macos
    defaults:
      run:
        shell: bash
    env:
      MNENODES_SCREENSHOT_DIR: docs/source/_static/screenshots/${{ matrix.platform }}
      QT_API: pyside6
      QT_SCALE_FACTOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install screenshot requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6<6.12" -e ".[test]"
      - name: Capture documentation scenarios
        run: python -m pytest tests/test_documentation_screenshots.py
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots-${{ matrix.platform }}
          path: docs/source/_static/screenshots/
          if-no-files-found: error

  build_docs:
    needs: screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup headless display
      uses: pyvista/setup-headless-display-action@main
      with:
        qt: true
        pyvista: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install requirements
      run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -ve ".[docs]"
    - name: Download screenshots from all operating systems
      uses: actions/download-artifact@v8
      with:
        pattern: docs-screenshots-*
        path: docs/source/_static/screenshots/
        merge-multiple: true
    - name: Build docs
      run: |
          cd ./docs
          make html
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: html-docs
        path: docs/build/html/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
