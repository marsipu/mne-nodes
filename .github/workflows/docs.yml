name: "Render Documentation"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  screenshots:
    name: Capture screenshots (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      MNENODES_SCREENSHOT_DIR: docs/source/_static/screenshots/linux
      QT_API: pyside6
      QT_SCALE_FACTOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install screenshot requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6<6.12" -e ".[test]"
      - name: Capture documentation scenarios
        run: python -m pytest tests/test_documentation_screenshots.py
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots-linux
          path: docs/source/_static/screenshots/
          if-no-files-found: error

  build_docs:
    needs: screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install requirements
      run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
    - name: Download Linux screenshots
      uses: actions/download-artifact@v8
      with:
        name: docs-screenshots-linux
        path: docs/source/_static/screenshots/
    - name: Build docs
      run: |
          for image in pipeline node-picker function-importer coregistration; do
            test -s "docs/source/_static/screenshots/linux/${image}.png"
          done
          zensical build --clean --strict
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: html-docs
        path: docs/build/zensical/
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      with:
        path: docs/build/zensical/

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build_docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
