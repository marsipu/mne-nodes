name: Upload to PyPi

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build and validate package
        id: build
        uses: hynek/build-and-inspect-python-package@v2
        with:
          python-version: '3.13'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-failure:
    name: Notify on release failure
    if: ${{ always() && (needs.build.result != 'success' || needs.publish.result != 'success') }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open release failure issue
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "PyPI publication failed: ${{ github.event.release.tag_name }}"
          body: |
            @marsipu PyPI publication did not complete successfully.

            GitHub release: ${{ github.event.release.html_url }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (attempt ${{ github.run_attempt }})
            Build: ${{ needs.build.result }}
            Publish: ${{ needs.publish.result }}

            Inspect the workflow logs and check PyPI for any partial upload before retrying.
            The GitHub release is already published.
