name: Upload to PyPi

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/run_tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v7
        with:
            python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine packaging
      - name: Build package
        run: |
          rm -rf dist build ./*.egg-info
          python -m build
          python -m twine check --strict dist/*
      - name: Verify package versions match release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          expected = Version(tag.removeprefix("v"))
          if expected.is_devrelease or expected.local is not None:
              raise SystemExit("Development and local versions cannot be published.")
          if expected.is_prerelease != (os.environ["IS_PRERELEASE"] == "true"):
              raise SystemExit("The GitHub pre-release flag must match the tag version.")

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one source distribution.")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("Expected exactly one wheel metadata file.")
              wheel_metadata = archive.read(metadata_files[0])

          with tarfile.open(sdists[0]) as archive:
              metadata_files = [
                  member for member in archive.getmembers()
                  if member.name.endswith("/PKG-INFO")
                  and member.name.count("/") == 1
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("Expected exactly one source metadata file.")
              source = archive.extractfile(metadata_files[0])
              if source is None:
                  raise SystemExit("Source distribution metadata is not a file.")
              with source:
                  sdist_metadata = source.read()

          for path, metadata in zip(
              [wheels[0], sdists[0]], [wheel_metadata, sdist_metadata]
          ):
              actual = Version(BytesParser().parsebytes(metadata)["Version"])
              if actual != expected:
                  raise SystemExit(f"{path}: version {actual} does not match {tag}.")
              print(f"{path}: verified version {actual}")
          PY
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
