[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mne-nodes"
authors = [
    { name = "Martin G. Schulz", email = "dev@mgschulz.de" }
]
description = "A GUI with Node-Layout for data analysis with MNE-Python"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["mne-python", "meg", "eeg", "pipeline", "gui", "heidelberg"]
classifiers = [
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # MNE processing, BIDS data organization, and coregistration.
    "mne",
    "mne-bids",
    "traitlets",
    # MRI data and interactive MNE visualization.
    "mne-qt-browser",
    "nibabel",
    "pyvistaqt",
    "vtk",
    # Tabular data support.
    "pandas",
    # Qt GUI toolkit, theme detection, icons, and macOS integration.
    "darkdetect",
    "pyobjc-framework-Cocoa; sys_platform == 'Darwin'",
    "qtawesome",
    "qtpy",
    # File locking, process inspection, and streaming JSON.
    "filelock",
    "ijson",
    "psutil",
    # Logging and GUI console rendering.
    "rich",
    "ansi2html>=1.9.5",
    # Function documentation and plugin/package metadata.
    "docstring_parser",
    "packaging>=24.2",
]
dynamic = ["version"]
[project.optional-dependencies]
test = [
    # Build and install test packages.
    "build",
    "editables",
    "hatchling>=1.27",
    # Test runner, Qt integration, and progress output used in tests.
    "pytest",
    "pytest-qt",
    "tqdm",
    # Code quality tools.
    "pre-commit",
    "ruff",
]
docs = [
    "zensical>=0.1,<0.2",
]


[project.urls]
Homepage = "https://github.com/marsipu/mne-nodes"
Repository = "https://github.com/marsipu/mne-nodes.git"

[project.gui-scripts]
mne_nodes = "mne_nodes.__main__:main"

[tool.hatch.build]
exclude = [
    "/.*",
    "/*.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mne_nodes"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/development",
    "/docs",
    "/docker",
    "/pyproject.toml",
    "/zensical.toml",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "release-branch-semver" }
fallback-version = "0.0.0"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
fix = true
show-fixes = true
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

# For type checking
[tool.pyright.defineConstant]
PYQT5 = false
PYSIDE2 = false
PYQT6 = false
PYSIDE6 = true

[tool.docformatter]
in-place = true
recursive = true

[tool.doc8]
ignore = ["D001", "D004"]
file-encoding = "utf-8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=long -p no:cacheprovider --import-mode=importlib"
qt_api = "pyside6"
qt_no_opengl = true
log_cli = true
log_cli_level = "INFO"
