# Settings exposed in the application dialog. User values remain in settings.json.

[app_theme]
tab = "Appearance"
gui_type = "ComboGui"
default = "auto"
alias = "Application theme"
description = "Use the system theme automatically, or choose a fixed theme."
restart_required = true
[app_theme.gui_kwargs]
options = ["auto", "light", "dark", "high_contrast"]

[app_style]
tab = "Appearance"
gui_type = "ComboGui"
default = "fusion"
alias = "Application style"
description = "Choose a Qt widget style available on this device."
options_source = "styles"
restart_required = true

[app_font]
tab = "Appearance"
gui_type = "ComboGui"
default = "Calibri"
alias = "Application font"
description = "Choose the default application font family."
options_source = "fonts"
restart_required = true

[app_font_size]
tab = "Appearance"
gui_type = "IntGui"
default = 12
alias = "Font size"
description = "Set the default application font size in points."
restart_required = true
[app_font_size.gui_kwargs]
min_val = 5
max_val = 36

[screen_ratio]
tab = "Appearance"
gui_type = "FloatGui"
default = 0.8
alias = "Window size"
description = "Set the fraction of the screen used for the main window at startup."
restart_required = true
[screen_ratio.gui_kwargs]
min_val = 0.1
max_val = 1.0
step = 0.05

[pipe_layout]
tab = "Node Editor"
gui_type = "ComboGui"
default = "curved"
alias = "Pipe style"
description = "Choose how connections between nodes are drawn. Applied immediately."
[pipe_layout.gui_kwargs]
options = ["curved", "straight", "angle", "routed"]

[console_word_wrap]
tab = "Console"
gui_type = "BoolGui"
default = true
alias = "Console word wrap"
description = "Wrap long lines in all consoles instead of scrolling horizontally. Applied immediately."
